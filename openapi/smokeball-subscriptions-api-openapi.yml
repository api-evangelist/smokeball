          type: string
          description: "If the subscription has been canceled, the date of that cancellation.\r\n\r\nOtherwise, the date of the cancel request."
          format: date-time
          nullable: true
          example: '2024-12-01T09:00:00Z'
        cancelAt:
          type: string
