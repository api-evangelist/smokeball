          format: double
          example: 32
        debtors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Link'
          description: The matter debtors.
        rateSetId:
          type:
          - string
          - 'null'
          description: 'The rate set id.


            Only supported in AU and the UK.'
          example: '100558'
        isUtbmsEnabled:
          type: boolean
          description: 'True if Uniform Task Based Management (UTBMS) is enabled for this matter.


            Only supported in the US.'
          example: true
        ledesFirmId:
          type:
          - string
          - 'null'
          description: 'The associated Legal Electronic Data Exchange Standard (LEDES) firm.


            Only supported in the US.'
          example: '100558'
        ledesMatterId:
